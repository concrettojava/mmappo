[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "info-mappo"
version = "0.1.0"
description = "Clean MAPPO training for the contested cooperative UAV environment"
requires-python = ">=3.10"
dependencies = ["numpy"]

[project.optional-dependencies]
rl = ["torch>=2.2", "matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["src"]
